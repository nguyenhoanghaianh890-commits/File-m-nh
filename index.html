<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZEZ KAWA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e14;--panel:#131a24;--panel2:#1b2532;--line:#2a3949;
  --txt:#e8f0f8;--dim:#7a8a9e;--pink:#ff4d7d;--pink2:#e63a6a;
  --red:#ff4d5e;--green:#3ddc84;--gold:#f5c542;--accent:#00d9ff}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;padding-bottom:60px}

/* LED VIỀN MỎNG QUANH BANNER */
.banner{max-width:900px;margin:22px auto 16px;padding:0 16px}
.bannerWrap{
  position:relative;display:block;padding:3px;border-radius:16px;
  background:conic-gradient(from 0deg,
    #ff0040,#ff4d7d,#ff8a00,#ffd400,#00e0b8,#00a3ff,#a06cff,#ff0040);
  animation:ledSpin 3s linear infinite;
}
.bannerWrap img{
  position:relative;z-index:1;width:100%;border-radius:13px;display:block;
}
@keyframes ledSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.zaloBar{max-width:900px;margin:0 auto 16px;padding:0 16px}
.zaloInner{background:linear-gradient(90deg,#1a1218,#2a1620);border:1px solid #ff4d7d;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;justify-content:center}
.zaloIcon{width:36px;height:36px;border-radius:50%;background:#0068ff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;flex-shrink:0}
.zaloText{font-size:15px;font-weight:800;letter-spacing:1px}
.zaloText .label{color:#8a7a82;font-weight:600;font-size:12px;letter-spacing:2px;margin-right:6px}
.zaloText .num{color:#ff4d7d;font-size:18px;font-family:ui-monospace,monospace}

.statsBar{max-width:900px;margin:0 auto 16px;padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.statBox{background:linear-gradient(180deg,#160f14,#0f0a0d);border:1px solid #26161d;border-radius:12px;padding:16px 12px;text-align:center}
.statBox .v{font-size:26px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:1px}
.statBox .k{font-size:10px;color:#7a8a9e;text-transform:uppercase;letter-spacing:2px;margin-top:6px}
@media(min-width:640px){.statsBar{grid-template-columns:repeat(4,1fr)}}

.header{text-align:center;padding:12px 16px 18px;background:radial-gradient(circle at 50% 0%,rgba(255,77,125,.15),transparent 60%)}
.header h1{font-size:30px;font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,77,125,.4))}
.header .line{width:60px;height:2px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--pink),transparent)}

.platformMain{display:flex;justify-content:center;padding:0 16px 12px;max-width:900px;margin:0 auto}
.pfMainSw{display:flex;background:#1a1218;border:1px solid #2a1f26;border-radius:14px;padding:4px;width:100%;max-width:360px}
.pfMainBtn{flex:1;padding:14px 8px;border:none;background:transparent;color:#8a7a82;font-size:14px;font-weight:800;letter-spacing:2px;cursor:pointer;border-radius:11px;transition:.18s;text-transform:uppercase}
.pfMainBtn.active{background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 4px 14px rgba(255,77,125,.45)}
.platformSub{display:none;justify-content:center;padding:0 16px 16px;max-width:900px;margin:0 auto}
.platformSub.show{display:flex}
.pfSubSw{display:flex;background:#1a1218;border:1px solid #2a1f26;border-radius:14px;padding:4px;width:100%;max-width:400px}
.pfSubBtn{flex:1;padding:12px 6px;border:none;background:transparent;color:#8a7a82;font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;border-radius:11px;transition:.18s;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.pfSubBtn.active{background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 4px 14px rgba(255,77,125,.45)}
.searchWrap{padding:0 16px 16px;max-width:900px;margin:0 auto}
.search{width:100%;height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:0 16px;font-size:14px;outline:none}
.search:focus{border-color:var(--pink)}
.section{max-width:900px;margin:0 auto;padding:0 16px 24px}
.section h2{font-size:13px;color:var(--pink);letter-spacing:3px;text-transform:uppercase;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section h2::before{content:'';width:4px;height:16px;background:var(--pink);border-radius:2px}
.section h2 .count{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:#160f14;border:1px solid #26161d;border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .15s}
.item:hover{border-color:var(--pink);transform:translateX(2px)}
.item .thumb{width:44px;height:44px;border-radius:10px;background:#2a1620;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.item .body{flex:1;min-width:0}
.item .tname{font-size:14px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .metaRow{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:11px}
.item .dl{color:var(--dim);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.item .dl::before{content:'⬇';opacity:.7}
.badge{font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:5px;text-transform:uppercase}
.badge.hot{color:#ff5566;background:rgba(255,77,125,.12);border:1px solid rgba(255,77,125,.3)}
.badge.hot::before{content:'🔥 '}
.badge.new{color:#3ddc84;background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.3)}
.badge.new::before{content:'★ '}
.badge.vip{color:#f5c542;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.3)}
.emptyMsg{text-align:center;color:var(--dim);padding:60px 16px;font-size:13px}
.greetCard{max-width:900px;margin:8px 16px 40px;background:#160f14;border:1px solid #26161d;border-radius:14px;padding:20px;text-align:center;line-height:1.7}
.greetCard .g1{font-size:14px;color:var(--txt)}
.greetCard .g2{font-size:12px;color:var(--pink);letter-spacing:5px;margin-top:8px;font-weight:700;text-transform:uppercase}
#adminBtn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#f5c542,#c99a1e);border:none;color:#2a1d00;font-weight:900;font-size:22px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:50;box-shadow:0 8px 24px rgba(245,197,66,.5)}
#adminBtn.on{display:flex}
#adminPanel{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;overflow-y:auto;padding:20px}
#adminPanel.on{display:block}
.adminBox{max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.adminBox h2{font-size:16px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.adminBox h2 .close{margin-left:auto;cursor:pointer;color:var(--red);font-size:22px;font-weight:900}
.adminBox label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;margin-top:10px}
.adminBox input,.adminBox select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px 12px;font-size:13px;outline:none}
.adminBox button{width:100%;height:42px;border:none;border-radius:8px;background:linear-gradient(180deg,#00d9ff,#0094b8);color:#001018;font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;margin-top:12px}
.adminBox button.gold{background:linear-gradient(180deg,#f5c542,#c99a1e);color:#2a1d00}
.adminBox button.red{background:linear-gradient(180deg,#ff4d5e,#c42535);color:#fff}
.adminBox .sec-title{font-size:11px;color:var(--accent);letter-spacing:2px;margin-top:20px;font-weight:700}
.fileList{max-height:400px;overflow-y:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#0a0e14}
.fileRow{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel2);border-radius:6px;margin-bottom:4px;font-size:11px}
.fileRow .fn{flex:1;color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileRow .fv{color:var(--accent)}
.fileRow .edit{background:var(--gold);color:#2a1d00;border:none;border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer}
.fileRow .del{background:var(--red);color:#fff;border:none;border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer;margin-left:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>

<div class="banner">
  <div class="bannerWrap">
    <img src="banner.png" alt="AZEZ KAWA">
  </div>
</div>

<div class="zaloBar">
  <div class="zaloInner">
    <div class="zaloIcon">Z</div>
    <div class="zaloText">
      <span class="label">ZALO:</span>
      <span class="num">0396859108</span>
    </div>
  </div>
</div>

<div class="statsBar">
  <div class="statBox"><div class="v" id="statFile">0</div><div class="k">File</div></div>
  <div class="statBox"><div class="v" id="statDL">0</div><div class="k">Tải xuống</div></div>
  <div class="statBox"><div class="v" id="statVisit">0</div><div class="k">Truy cập</div></div>
  <div class="statBox"><div class="v" id="statCat">5</div><div class="k">Danh mục</div></div>
</div>

<div class="header">
  <h1>✦ AZEZ KAWA ✦</h1>
  <div class="line"></div>
</div>

<div class="platformMain"><div class="pfMainSw" id="pfMain"></div></div>
<div class="platformSub" id="subRow"><div class="pfSubSw" id="pfSub"></div></div>

<div class="searchWrap">
  <input class="search" id="searchInput" placeholder="Tìm kiếm..." autocomplete="off">
</div>

<div id="content"></div>

<div class="greetCard">
  <div class="g1">🌤 Chúc bạn một buổi trưa vui vẻ!</div>
  <div class="g2">✦ AZEZ KAWA SYSTEM ONLINE ✦</div>
</div>

<button id="adminBtn">⚙</button>

<div id="adminPanel">
  <div class="adminBox">
    <h2>⚙ ADMIN <span class="close" id="adminClose">×</span></h2>
    <div class="sec-title">THÊM FILE</div>
    <label>Platform</label>
    <select id="addMain"><option value="ios">iOS</option><option value="adr">ADR</option></select>
    <label>Sub</label>
    <select id="addSub"></select>
    <label>Danh mục</label>
    <select id="addCatSel"></select>
    <label>Tên file</label>
    <input id="addName" placeholder="VD: AIM FOV + ESP">
    <label>Badge</label>
    <select id="addBadge">
      <option value="">(Không)</option>
      <option value="HOT">HOT</option>
      <option value="NEW">NEW</option>
      <option value="VIP">VIP</option>
    </select>
    <label>Link tải (bắt buộc)</label>
    <input id="addLink" placeholder="https://...">
    <button class="gold" id="addBtn">+ THÊM FILE</button>

    <div class="sec-title">DANH SÁCH FILE</div>
    <div class="fileList" id="fileList"></div>

    <button class="red" id="resetAllBtn">RESET TOÀN BỘ</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

var DEFAULT = {
  ios: {
    filza: {
      "AIM FOV + ESP": [
        {n:"AIM FOV + ESP", b:"HOT"},
        {n:"AIM BODY"},
        {n:"MENU DELTA"},
        {n:"MENU FFTH"},
        {n:"AIM DRAG"},
        {n:"144 FPS"},
        {n:"RESET ACC KHÁCH"},
        {n:"MENU VIP"},
        {n:"ESP + AIM FOV"},
        {n:"ĐẠN THẲNG + FIX RUNG"},
        {n:"AIM BODY 95%"},
        {n:"AIM CHEST"},
        {n:"AIM SILENT"},
        {n:"FIX LAG"},
        {n:"MOD SKIN ALOK"},
        {n:"TĂNG ĐỘ NHẠY", b:"NEW"},
        {n:"UNBAN VV", b:"NEW"}
      ]
    },
    "3105": {
      "AIM BOT + ESP": [
        {n:"AIM FOV + ESP", b:"HOT"},
        {n:"MENU FFTH"},
        {n:"RESET ACC KHÁCH"},
        {n:"AIM DRAG"},
        {n:"AIM BODY"},
        {n:"MENU DELTA"},
        {n:"144 FPS"},
        {n:"MAGIC + AIM LOCK"},
        {n:"MENU VIP"},
        {n:"ĐẠN THẲNG + FIX RUNG"},
        {n:"CAPCUT PRO"},
        {n:"MOD SKIN ALOK"},
        {n:"AIM CHEST"},
        {n:"CÂN CHECK", b:"NEW"},
        {n:"AIM SILENT"},
        {n:"AIM BODY 95%"},
        {n:"TĂNG ĐỘ NHẠY", b:"NEW"},
        {n:"UNBAN VV", b:"NEW"}
      ]
    },
    ipa: {
      "TOOLS": [
        {n:"DELTA CRACK", b:"HOT"},
        {n:"FILZA IOS CAO"},
        {n:"3105 BETA 5"},
        {n:"TROLLSTORE"},
        {n:"ESIGN"},
        {n:"FILZA IOS THẤP"},
        {n:"FLORK CRACK"},
        {n:"MIGUL CRACK"},
        {n:"3105 FIX"},
        {n:"8 BALL POOL HACK"},
        {n:"DELTA CLIENT CRACK", b:"NEW"},
        {n:"XOÁ TK KHÁCH"},
        {n:"NEXT DNS"},
        {n:"SHADOWROCKET"},
        {n:"TROLL X"},
        {n:"AIM KILL"},
        {n:"TROLLFOOLS"},
        {n:"H5GG MAKE"},
        {n:"3105 IOS 27"},
        {n:"GTA MOD PACK"},
        {n:"ROOTHIDE"},
        {n:"SPAM ARDROP"},
        {n:"VARCLEAN", b:"NEW"},
        {n:"MIGUL LIÊN QUÂN", b:"NEW"}
      ],
      "AIM BODY": [
        {n:"AIM BODY", b:"HOT"},
        {n:"Fluorite CRACK"}
      ]
    }
  },
  adr: {
    file: {
      "AIM FOV + ESP": [
        {n:"AIM FOV + ESP", b:"HOT"},
        {n:"AIM BODY"},
        {n:"MENU DELTA"}
      ]
    },
    apk: {
      "TOOLS": [
        {n:"APK EDITOR", b:"HOT"},
        {n:"MT MANAGER"},
        {n:"LUCKY PATCHER", b:"NEW"}
      ]
    }
  }
};

var SUBS = {
  ios: [{k:"filza",l:"FILZA",i:"📁"},{k:"3105",l:"3105",i:"💻"},{k:"ipa",l:"IPA",i:"📦"}],
  adr: [{k:"file",l:"FILE",i:"📄"},{k:"apk",l:"APK",i:"📱"}]
};

var SK = "azez_v9";
var VISIT_KEY = "azez_visit";
var ADMIN_TRIGGER = "adminweb";
var DB, cMain="ios", cSub=null, adminOn=false;

function load(){ try { var r=localStorage.getItem(SK); if(r){ DB=JSON.parse(r); return; } } catch(e){} DB=JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try { localStorage.setItem(SK, JSON.stringify(DB)); } catch(e){} }
function reset(){ try { localStorage.removeItem(SK); } catch(e){} DB=JSON.parse(JSON.stringify(DEFAULT)); save(); }

var $ = function(s){ return document.querySelector(s); };
var tTO;
function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tTO); tTO=setTimeout(function(){t.classList.remove("on");},1400); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function icon(){ var l=SUBS[cMain]||[]; for(var i=0;i<l.length;i++) if(l[i].k===cSub) return l[i].i; return "📁"; }

function subHasData(sk){
  var o = (DB[cMain]||{})[sk] || {};
  var t = 0;
  Object.keys(o).forEach(function(c){
    (o[c]||[]).forEach(function(it){ if (it.l) t++; });
  });
  return t > 0;
}

function formatNum(n){
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "K";
  return String(n);
}

function updateStats(){
  var totalFiles = 0;
  var totalDL = 0;

  Object.keys(DB).forEach(function(main){
    Object.keys(DB[main]||{}).forEach(function(sub){
      Object.keys(DB[main][sub]||{}).forEach(function(cat){
        (DB[main][sub][cat]||[]).forEach(function(it){
          if (it.l){
            totalFiles++;
            totalDL += (it.d||0);
          }
        });
      });
    });
  });

  var visit = parseInt(localStorage.getItem(VISIT_KEY) || "0", 10);

  $("#statFile").textContent = formatNum(totalFiles);
  $("#statDL").textContent = formatNum(totalDL);
  $("#statVisit").textContent = formatNum(visit);
  $("#statCat").textContent = "5";
}

function countVisit(){
  var v = parseInt(localStorage.getItem(VISIT_KEY) || "0", 10);
  if (!sessionStorage.getItem("azez_visit_counted")){
    v++;
    localStorage.setItem(VISIT_KEY, String(v));
    sessionStorage.setItem("azez_visit_counted", "1");
  }
}

function renderMain(){
  var box = $("#pfMain"); box.innerHTML="";
  [{k:"ios",l:"IOS"},{k:"adr",l:"ADR"}].forEach(function(m){
    var b = document.createElement("button");
    b.className = "pfMainBtn" + (m.k===cMain?" active":"");
    b.textContent = m.l;
    b.onclick = function(){
      cMain = m.k;
      var subs = SUBS[cMain] || [];
      cSub = null;
      for (var i=0;i<subs.length;i++){
        if (subHasData(subs[i].k)){ cSub = subs[i].k; break; }
      }
      renderMain(); renderSub(); render("");
    };
    box.appendChild(b);
  });
}

function renderSub(){
  var box = $("#pfSub"); box.innerHTML="";
  var row = $("#subRow");
  var avail = (SUBS[cMain]||[]).filter(function(s){ return subHasData(s.k); });

  if (avail.length === 0){
    row.classList.remove("show");
    cSub = null;
    return;
  }
  row.classList.add("show");

  if (!cSub || !avail.some(function(s){ return s.k===cSub; })){
    cSub = avail[0].k;
  }

  avail.forEach(function(s){
    var b = document.createElement("button");
    b.className = "pfSubBtn" + (s.k===cSub?" active":"");
    b.innerHTML = s.i + " " + s.l;
    b.onclick = function(){
      cSub = s.k;
      renderSub(); render("");
    };
    box.appendChild(b);
  });
}

function render(filter){
  filter = (filter||"").toLowerCase().trim();
  var box = $("#content"); box.innerHTML="";

  if (!cSub){
    box.innerHTML = '<div class="emptyMsg">Chưa có dữ liệu</div>';
    return;
  }

  var subObj = (DB[cMain]||{})[cSub] || {};
  var items = [];
  Object.keys(subObj).forEach(function(cat){
    (subObj[cat]||[]).forEach(function(it){
      if (it.l) items.push(it);
    });
  });

  if (filter) items = items.filter(function(it){ return it.n.toLowerCase().indexOf(filter)!==-1; });

  if (items.length === 0){
    box.innerHTML = '<div class="emptyMsg">Chưa có file</div>';
    return;
  }

  var wrap = document.createElement("div");
  wrap.className = "section";
  wrap.innerHTML = '<h2>FILES<span class="count">'+items.length+'</span></h2>';
  var list = document.createElement("div"); list.className="list";

  items.forEach(function(it){
    var c = document.createElement("div"); c.className="item";
    var badge = "";
    if (it.b==="HOT") badge='<span class="badge hot">HOT</span>';
    else if (it.b==="NEW") badge='<span class="badge new">NEW</span>';
    else if (it.b==="VIP") badge='<span class="badge vip">VIP</span>';

    c.innerHTML =
      '<div class="thumb">'+icon()+'</div>'+
      '<div class="body">'+
        '<div class="tname">'+esc(it.n)+'</div>'+
        '<div class="metaRow">'+
          '<span class="dl">'+(it.d||0)+'</span>'+
          badge +
        '</div>'+
      '</div>';

    c.onclick = function(){
      it.d = (it.d||0) + 1;
      save();
      updateStats();
      render($("#searchInput").value);
      window.open(it.l, "_blank");
    };
    list.appendChild(c);
  });
  wrap.appendChild(list); box.appendChild(wrap);
  updateStats();
}

$("#searchInput").addEventListener("input", function(){
  var v = this.value.trim().toLowerCase();
  if (v === ADMIN_TRIGGER){
    if (!adminOn){ adminOn = true; $("#adminBtn").classList.add("on"); toast("✓ Admin"); }
    this.value = "";
    render("");
    return;
  }
  render(this.value);
});

$("#adminBtn").onclick = function(){ $("#adminPanel").classList.add("on"); refreshAdmin(); };
$("#adminClose").onclick = function(){ $("#adminPanel").classList.remove("on"); };
$("#adminPanel").onclick = function(e){ if(e.target===this) this.classList.remove("on"); };

function buildSubOptions(){
  var m = $("#addMain").value;
  var sub = $("#addSub");
  var prev = sub.value;
  sub.innerHTML = "";
  (SUBS[m]||[]).forEach(function(s){
    var o = document.createElement("option");
    o.value = s.k; o.textContent = s.l;
    sub.appendChild(o);
  });
  var exists = Array.prototype.some.call(sub.options, function(op){ return op.value === prev; });
  if (exists) sub.value = prev;
  else if (sub.options.length > 0) sub.value = sub.options[0].value;
}

function refreshAdmin(){
  buildSubOptions();
  refreshCatSel();
  renderFileList();
}

function refreshCatSel(){
  var m = $("#addMain").value, s = $("#addSub").value;
  var sel = $("#addCatSel"); sel.innerHTML="";
  var cats = Object.keys((DB[m]||{})[s] || {});
  cats.forEach(function(c){
    var o = document.createElement("option"); o.value=c; o.textContent=c;
    sel.appendChild(o);
  });
  var no = document.createElement("option"); no.value="__new__"; no.textContent="+ Danh mục mới";
  sel.appendChild(no);
}

$("#addMain").addEventListener("change", function(){
  buildSubOptions();
  refreshCatSel();
  renderFileList();
});

$("#addSub").addEventListener("change", function(){
  refreshCatSel();
  renderFileList();
});

function renderFileList(){
  var box = $("#fileList"); box.innerHTML="";
  var m = $("#addMain").value;
  var obj = DB[m] || {};
  var any = false;

  Object.keys(obj).forEach(function(s){
    Object.keys(obj[s]).forEach(function(cat){
      if ((obj[s][cat]||[]).length === 0) return;
      any = true;
      var h = document.createElement("div");
      h.style.cssText = "font-size:10px;color:#00d9ff;letter-spacing:1.5px;margin:10px 0 4px;text-transform:uppercase";
      h.textContent = "▸ " + m + " / " + s + " / " + cat;
      box.appendChild(h);

      obj[s][cat].forEach(function(it, i){
        var row = document.createElement("div"); row.className="fileRow";
        var linkTag = it.l ? '<span class="fv">✓ LINK</span>' : '<span class="fv" style="color:#ff4d5e">✗</span>';
        row.innerHTML =
          '<span class="fn">'+esc(it.n)+'</span>'+
          '<span class="fv">'+(it.d||0)+'</span>'+
          linkTag +
          '<button class="edit" data-m="'+m+'" data-s="'+s+'" data-c="'+cat+'" data-i="'+i+'">SỬA</button>'+
          '<button class="del" data-m="'+m+'" data-s="'+s+'" data-c="'+cat+'" data-i="'+i+'">X</button>';
        box.appendChild(row);
      });
    });
  });

  if (!any){
    box.innerHTML = '<div style="text-align:center;color:#7a8a9e;padding:20px;font-size:12px">Chưa có file</div>';
    return;
  }

  box.querySelectorAll(".edit").forEach(function(b){
    b.onclick = function(){
      var m=b.dataset.m, s=b.dataset.s, c=b.dataset.c, i=+b.dataset.i;
      var it = DB[m][s][c][i];
      var link = prompt("Link tải cho: " + it.n + "\n(Để trống = xoá link)", it.l || "");
      if (link === null) return;
      link = link.trim();
      if (link) it.l = link; else delete it.l;
      save(); renderFileList();
      if (m===cMain){ renderSub(); render(""); }
      updateStats();
      toast("Đã lưu");
    };
  });

  box.querySelectorAll(".del").forEach(function(b){
    b.onclick = function(){
      var m=b.dataset.m, s=b.dataset.s, c=b.dataset.c, i=+b.dataset.i;
      if (confirm("Xoá " + DB[m][s][c][i].n + "?")){
        DB[m][s][c].splice(i, 1);
        save(); renderFileList();
        if (m===cMain){ renderSub(); render(""); }
        updateStats();
        toast("Đã xoá");
      }
    };
  });
}

$("#addBtn").onclick = function(){
  var m = $("#addMain").value;
  var s = $("#addSub").value;
  var cat = $("#addCatSel").value;
  if (cat === "__new__"){
    cat = prompt("Tên danh mục mới:");
    if (!cat) return;
  }
  var name = $("#addName").value.trim();
  var badge = $("#addBadge").value;
  var link = $("#addLink").value.trim();
  if (!name){ toast("Nhập tên file"); return; }
  if (!link){ toast("Nhập link tải"); return; }

  if (!DB[m]) DB[m]={};
  if (!DB[m][s]) DB[m][s]={};
  if (!DB[m][s][cat]) DB[m][s][cat]=[];

  var item = {n:name, d:0, l:link};
  if (badge) item.b = badge;

  DB[m][s][cat].unshift(item);
  save();
  $("#addName").value=""; $("#addBadge").value=""; $("#addLink").value="";
  refreshCatSel(); renderFileList();
  if (m===cMain){ cSub = s; renderSub(); render(""); }
  updateStats();
  toast("✓ Đã thêm");
};

$("#resetAllBtn").onclick = function(){
  if (confirm("RESET TOÀN BỘ?")){
    reset();
    cMain="ios"; cSub=null;
    renderMain(); renderSub(); render(""); renderFileList();
    updateStats();
    toast("Đã reset");
  }
};

load();
renderMain();
(function initSub(){
  var subs = SUBS[cMain] || [];
  cSub = null;
  for (var i=0;i<subs.length;i++){
    if (subHasData(subs[i].k)){ cSub = subs[i].k; break; }
  }
})();
renderSub();
render("");
refreshAdmin();
countVisit();
updateStats();

window.addEventListener("beforeunload", save);
window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", function(){ if (document.hidden) save(); });
setInterval(save, 5000);

})();
</script>
</body>
</html>
